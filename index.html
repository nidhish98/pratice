<!DOCTYPE html>
<html>

<body>

<h1>Register</h1>

<input
id="name"
placeholder="Enter Name">

<br><br>

<input
id="email"
placeholder="Enter Email">

<br><br>

<button onclick="register()">
Register
</button>

<script>

async function register(){

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const response =
    await fetch(
        "http://127.0.0.1:8000/register",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                name:name,
                email:email
            })
        }
    );

    const data =
    await response.json();

    console.log(data);
}

</script>

</body>
</html>
